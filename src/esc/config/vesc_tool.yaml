vesc_tool_bridge:
  ros__parameters:
    maintenance_poll_hz: 50.0
    tcp_service_hz: 1000.0
    max_abs_duty: 0.95
    max_abs_current_a: 20.0
    max_abs_erpm: 8000.0
    # Browser must renew this lease while Web Maintenance owns the motor link.
    # Lost tab/network => bridge safe-stops both motors then restores runtime.
    web_lease_timeout_ms: 5000
    # Stock VESC Tool enables Send Alive after one-shot Speed/Position/Current.
    # Keep TCP 65102 semantically identical while retaining the F103 300 ms watchdog.
    tcp_keepalive_period_ms: 100
    # Highest-priority Python hardware tools use 65101. VESC Tool remains on
    # 65102 and can stay connected while Python temporarily owns maintenance.
    python_tcp_enabled: true
    python_tcp_port: 65101
    tcp_enabled: true
    tcp_port: 65102
