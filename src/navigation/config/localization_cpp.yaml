# Localization bootstrap allows map display on sane degraded GNSS; autonomous motion still requires strict gate.
localization_core:
  ros__parameters:
    reference_latitude: -7.050964918716
    reference_longitude: 110.435059847106
    reference_map_x_m: 167.493142
    reference_map_y_m: 94.933756
    map_yaw_from_enu_rad: 0.0
    map_calibration_x_m: 0.0
    map_calibration_y_m: 0.0
    map_calibration_yaw_rad: 0.0
    persist_map_calibration: true
    map_calibration_file: ''
    gnss_antenna_x_m: 0.165
    gnss_antenna_y_m: 0.0
    gnss_velocity_topic: /gnss/vel
    gnss_velocity_fit_topic: /gnss/velocity_position_fit
    gnss_motion_history_sec: 6.0
    gnss_sync_max_gap_sec: 0.3
    gnss_velocity_timeout_sec: 0.8
    gnss_fit_timeout_sec: 4.0
    gnss_velocity_min_validation_speed_mps: 0.15
    gnss_speed_consistency_max_mps: 0.2
    gnss_fit_speed_residual_max_mps: 0.3
    gnss_cog_velocity_course_max_rad: 0.1745329252
    gnss_cog_fit_course_max_rad: 0.3490658504
    gnss_lateral_velocity_warn_mps: 0.15
    wheel_gnss_slip_residual_mps: 0.25
    cog_valid_hold_sec: 1.5
    cog_invalid_hold_sec: 0.5
    gnss_require_measurement_timestamp: true
    gnss_max_future_stamp_sec: 0.1
    gnss_max_measurement_age_sec: 1.0
    gnss_max_stamp_regression_sec: 0.02
    gnss_quality_timeout_sec: 0.6
    gnss_velocity_covariance_min_variance: 1.0e-06
    gnss_velocity_covariance_max_variance: 1.0
    require_gnss_velocity_certification_for_fusion: false
    require_gnss_cog_certification_for_fusion: false
    gnss_velocity_calibration_valid: false
    gnss_cog_calibration_valid: false
    gnss_velocity_calibration_saved_at: ''
    gnss_cog_calibration_saved_at: ''
    gnss_velocity_calibration_epoch_count: 0
    gnss_velocity_calibration_qualified_ratio: 0.0
    gnss_velocity_calibration_sync_p95_sec: 0.0
    gnss_velocity_calibration_wheel_residual_p95_mps: 0.0
    gnss_velocity_calibration_lateral_p95_mps: 0.0
    gnss_cog_calibration_epoch_count: 0
    gnss_cog_calibration_qualified_ratio: 0.0
    gnss_cog_calibration_residual_p95_rad: 0.0
    stage2_min_velocity_epochs: 50
    stage2_min_cog_epochs: 30
    stage2_min_velocity_qualified_ratio: 0.85
    stage2_min_cog_qualified_ratio: 0.7
    stage2_max_sync_gap_p95_sec: 0.2
    stage2_max_wheel_gnss_residual_p95_mps: 0.25
    stage2_max_lateral_velocity_p95_mps: 0.15
    stage2_max_cog_doppler_residual_p95_rad: 0.1745329252
    enable_global_gnss_velocity_fusion: true
    enable_global_gnss_cog_fusion: true
    gnss_velocity_fusion_topic: /gnss/base_velocity_fusion
    gnss_cog_fusion_topic: /gnss/cog_heading_fusion
    gnss_velocity_fusion_min_variance: 0.0025
    gnss_velocity_fusion_max_variance: 0.25
    gnss_cog_fusion_min_variance_rad2: 0.00121846968
    gnss_cog_fusion_max_variance_rad2: 0.2741556778
    gnss_fusion_measurement_timeout_sec: 1.0
    use_global_ekf_yaw_for_map_correction: true
    global_ekf_yaw_correction_alpha: 0.05
    global_ekf_yaw_max_step_rad: 0.00872664626
    # Allow recovery from a bad startup magnetic seed (e.g. ~90 deg) once COG is
    # motion-qualified. Per-update yaw correction remains rate-limited below.
    global_ekf_yaw_max_innovation_rad: 2.3561944902
    enable_gnss_course_yaw_correction: false
    # Must be reachable in Stage-3 commissioning (speed cap 0.18 m/s).
    # COG is still guarded by UBX course accuracy, sAcc, straight-motion, forward-only,
    # velocity/course consistency and a hold timer before it may correct heading.
    cog_min_forward_speed_mps: 0.15
    cog_max_sacc_mps: 0.3
    cog_max_heading_accuracy_rad: 0.3490658504
    cog_max_local_yaw_rate_rps: 0.12
    cog_max_innovation_rad: 2.3561944902
    cog_yaw_alpha: 0.02
    cog_max_yaw_step_rad: 0.00872664626
    map_min_x_m: 0.0
    map_max_x_m: 620.0
    map_min_y_m: 0.0
    map_max_y_m: 400.0
    map_bounds_margin_m: 0.6
    allow_degraded_planning: true
    allow_provisional_map_display: true
    provisional_min_satellites: 3
    provisional_max_dop: 25.0
    provisional_max_hacc_m: 150.0
    degraded_min_satellites: 6
    degraded_max_dop: 8.0
    degraded_max_hacc_m: 25.0
    startup_gnss_samples: 5
    startup_imu_samples: 50
    startup_max_spread_m: 5.0
    global_odom_map_reference_max_error_m: 15.0
    strict_min_satellites: 8
    strict_max_dop: 2.0
    strict_max_hacc_m: 3.0
    strict_quality_hold_sec: 1.5
    motion_hold_max_hacc_m: 4.5
    motion_hold_max_dop: 2.5
    motion_hold_min_satellites: 8
    motion_degrade_grace_sec: 3.0
    motion_critical_max_hacc_m: 6.0
    motion_critical_max_dop: 4.0
    motion_critical_min_satellites: 6
    strict_correction_alpha: 0.08
    freeze_stationary_map_translation: true
    strict_moving_correction_alpha: 0.01
    enable_wheel_slip_pose_correction: false
    strict_slip_correction_alpha: 0.1
    strict_max_correction_m: 0.08
    strict_max_yaw_correction_rad: 0.017453292519943295
    strict_stationary_speed_mps: 0.04
    strict_stationary_yaw_rate_rps: 0.08
    slip_min_wheel_speed_mps: 0.25
    slip_speed_difference_mps: 0.2
    slip_sacc_multiplier: 0.5
    slip_yaw_rate_difference_rps: 0.2
    esc_kinematic_yaw_rate_topic: /esc/kinematic_yaw_rate_rps
    esc_kinematic_yaw_timeout_sec: 0.5
    gnss_timeout_sec: 2.5
    imu_timeout_sec: 0.75
    odom_timeout_sec: 0.75
    tf_publish_rate_hz: 30.0
    tf_future_offset_sec: 0.05
    status_publish_rate_hz: 1.0
    log_heartbeat_sec: 10.0
    allow_manual_pose_for_motion: false
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    raw_gnss_topic: /gnss/fix_raw
    quality_topic: /gnss/quality
    imu_topic: /imu/data
    local_odom_topic: /odometry/filtered
    global_odom_topic: /odometry/filtered_map
    use_imu_initial_heading: true
    allow_map_calibration_with_degraded_fix: true
    map_calibration_samples_file: ''
    multi_point_map_calibration: true
    map_calibration_min_unique_points: 3
    map_calibration_unique_distance_m: 1.0
    map_calibration_min_baseline_m: 2.0
    map_calibration_min_geometry_score: 0.03
    map_calibration_max_rmse_m: 3.0
    calibration_capture_window_sec: 3.0
    calibration_capture_min_samples: 3
    gnss_yaw_rate_min_speed_mps: 0.2
    gnss_yaw_rate_max_abs_rps: 1.5
    gnss_yaw_rate_filter_alpha: 0.35
    gnss_yaw_rate_min_variance: 0.0025
    gnss_yaw_rate_max_variance: 4.0
    anchor_init_requires_strict: false
