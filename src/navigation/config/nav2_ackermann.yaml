map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    topic_name: map
    frame_id: map
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 0.5
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      # Precision outdoor commissioning: keep the native 0.10 m costmap grid.
      # Downsampling x2 previously snapped a 5.000 m relative target ~7 cm off-end.
      tolerance: 0.05
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 250000
      max_on_approach_iterations: 1000
      max_planning_time: 2.5
      motion_model_for_search: DUBIN
      angle_quantization_bins: 48
      minimum_turning_radius: 1.452435565298
      reverse_penalty: 3.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.2
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 8.0
      lookup_table_size: 20.2
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 200
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-06
        do_refinement: false
controller_server:
  ros__parameters:
    use_sim_time: false
    # Explicit override untuk parameter internal MPPI. Pada binary Humble yang
    # terpasang, constructor library masih dapat menulis satu warning sebelum
    # override ini dideklarasikan; setelah konfigurasi nilainya tetap false.
    controller_server.verbose: false
    controller_frequency: 8.0
    min_x_velocity_threshold: 0.08
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.03
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # 8 cm is tighter than one map cell yet still leaves margin for 0.12 m/s
      # low-speed stopping and single-antenna GNSS noise; final validation uses TF+GNSS averaging.
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.0872664626
      stateful: false
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # Horizon lokal diperpanjang agar MPPI mulai membentuk bypass sebelum
      # obstacle masuk zona hard-stop. 32 x 0.125 s = 4 s.
      time_steps: 32
      model_dt: 0.125
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.1
      vy_std: 0.0
      wz_std: 0.25
      vx_max: 1.0
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.688498701004
      ax_max: 0.75
      ax_min: -1.0
      ay_max: 0.0
      az_max: 0.75
      temperature: 0.3
      gamma: 0.015
      motion_model: Ackermann
      visualize: true
      regenerate_noises: false
      reset_period: 1.0
      prune_distance: 3.0
      transform_tolerance: 0.3
      TrajectoryVisualizer:
        # Render 1/20 sampled rollouts.  MPPI still optimizes all 1000 samples;
        # this only reduces MarkerArray/DDS/GUI load while keeping candidates visible.
        trajectory_step: 20
        time_step: 4
      AckermannConstraints:
        min_turning_r: 1.452435565298
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      - VelocityDeadbandCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        inflation_layer_name: inflation_layer
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Jangan terlalu mengunci global path: obstacle dinamis harus dapat
        # menghasilkan local detour selama tetap di drivable corridor.
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.15
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities:
        - 0.1
        - 0.0
        - 0.03
    odom_topic: /odometry/filtered
    odom_duration: 0.25
    publish_zero_velocity: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 125
    default_server_timeout: 500
    wait_for_service_timeout: 2000
    default_nav_to_pose_bt_xml: ''
    default_nav_through_poses_bt_xml: ''
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [1.0, 0.0, 1.396263401595]
    min_velocity: [-1.0, 0.0, -1.396263401595]
    max_accel:
    - 0.18
    - 0.0
    - 0.55
    max_decel:
    - -0.28
    - 0.0
    - -0.75
    odom_topic: /odometry/filtered
    odom_duration: 0.15
    deadband_velocity:
    - 0.03
    - 0.0
    - 0.015
    velocity_timeout: 0.4
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.1
      footprint: '[[0.52,0.30],[0.52,-0.30],[-0.52,-0.30],[-0.52,0.30]]'
      footprint_padding: 0.03
      plugins:
      - drivable_boundary_layer
      - obstacle_layer
      - inflation_layer
      # Virtual wall dari drivable segmentation dipisah dari obstacle layer agar
      # clearing fan obstacle tidak menghapus boundary jalan.
      drivable_boundary_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: drivable_boundary
        drivable_boundary:
          topic: /perception/drivable_boundary_points
          data_type: PointCloud2
          clearing: true
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: -0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1
          raytrace_max_range: 4.2
          raytrace_min_range: 0.0
          observation_persistence: 0.10
          expected_update_rate: 0.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: yolop_points yolop_clearing
        yolop_points:
          topic: /perception/planning_relevant_points
          data_type: PointCloud2
          clearing: true
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: -0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          observation_persistence: 0.25
          expected_update_rate: 0.0
        yolop_clearing:
          topic: /perception/object_clearing_points
          data_type: PointCloud2
          clearing: true
          marking: false
          max_obstacle_height: 1.5
          min_obstacle_height: -0.1
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Boundary drivable menjadi virtual wall. Footprint MPPI sudah dipakai,
        # jadi inflation tidak perlu 0.8 m yang terlalu menutup ruang bypass.
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      always_send_full_costmap: false
      transform_tolerance: 0.3
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 0.5
      publish_frequency: 0.2
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.1
      footprint: '[[0.52,0.30],[0.52,-0.30],[-0.52,-0.30],[-0.52,0.30]]'
      footprint_padding: 0.03
      track_unknown_space: false
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.8
        cost_scaling_factor: 2.5
      lethal_cost_threshold: 100
      always_send_full_costmap: false
      transform_tolerance: 0.3
