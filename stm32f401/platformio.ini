; ADV HMI — STM32F411CEU6 + ILI9341 320x240 + XPT2046
; Default upload path is USB CDC -> STM32 ROM DFU.
; ST-Link remains available only as a bootstrap/recovery environment.

[platformio]
default_envs = blackpill_f411ce

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 1000000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -Iinclude
    -include ArduinoCompat.h
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DUSER_SETUP_LOADED=1
    -DSTM32
    -DILI9341_DRIVER
    -DTFT_SPI_PORT=1
    -DTFT_MISO=PA6
    -DTFT_MOSI=PA7
    -DTFT_SCLK=PA5
    -DTFT_CS=PB0
    -DTFT_DC=PB1
    -DTFT_RST=PB2
    -DTOUCH_CS=PA4
    -DSPI_FREQUENCY=10000000
    -DSPI_READ_FREQUENCY=6000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_GFXFF
    -DSUPPORT_TRANSACTIONS
    -DHMI_DEMO_MODE=0
    -DSERIAL_RX_BUFFER_SIZE=1024
    -DSERIAL_TX_BUFFER_SIZE=512
    ; Bound failed I2C transactions so an unplugged IST8310 cannot starve GNSS/VESC.
    -DI2C_TIMEOUT_TICK=2
    ; Keep USB queues short to bound latency. Sensor/VESC records are now
    ; buffered into complete writes, so depth is for jitter absorption only.
    -DCDC_RECEIVE_QUEUE_BUFFER_PACKET_NUMBER=16
    -DCDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=8

[env:blackpill_f411ce]
upload_protocol = dfu
upload_command = $PROJECT_DIR/scripts/dfu_upload_blackpill.sh $SOURCE
extra_scripts = pre:scripts/usb_dfu_upload.py
custom_usb_cdc_port = /dev/serial/by-id/usb-STMicroelectronics_BLACKPILL_F411CE_CDC_in_FS_Mode_338133833134-if00

[env:blackpill_f411ce_stlink]
upload_protocol = stlink
