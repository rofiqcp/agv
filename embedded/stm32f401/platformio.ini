; ADV HMI — STM32F411CEU6 + ILI9341 320x240 + XPT2046
; Existing wiring preserved:
;   SCK=PA5  MISO=PA6  MOSI=PA7
;   TFT_CS=PB0  TFT_DC=PB1  TFT_RST=PB2
;   TOUCH_CS=PA4

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DUSER_SETUP_LOADED=1
    -DSTM32
    -DILI9341_DRIVER
    -DTFT_SPI_PORT=1
    -DTFT_MISO=PA6
    -DTFT_MOSI=PA7
    -DTFT_SCLK=PA5
    -DTFT_CS=PB0
    -DTFT_DC=PB1
    -DTFT_RST=PB2
    -DTOUCH_CS=PA4
    -DSPI_FREQUENCY=10000000
    -DSPI_READ_FREQUENCY=6000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_GFXFF
    -DSUPPORT_TRANSACTIONS
    -DHMI_DEMO_MODE=0
