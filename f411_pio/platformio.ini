; ADV HMI — STM32F411CEU6 — native STM32Cube HAL port
; Arduino reference is preserved in ../f411_pio_arduino.

[platformio]
default_envs = blackpill_f411ce

[env]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
monitor_speed = 1000000
board_build.f_cpu = 96000000L

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Iinclude
    -DSTM32F411xE
    -DUSE_HAL_DRIVER
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSBD_SELF_POWERED=0
    -DUSBD_MAX_NUM_INTERFACES=2
    -DHMI_DEMO_MODE=0
    -DHMI_LEGACY_UART=0
    -Wall
    -Wextra
    -Wformat=2
    -Wshadow
    -Wundef
    -Wdouble-promotion
    -Wl,-u,_printf_float

[env:blackpill_f411ce]
upload_protocol = dfu
upload_command = $PROJECT_DIR/scripts/dfu_upload_blackpill.sh $SOURCE
extra_scripts = pre:scripts/usb_dfu_upload.py
custom_usb_cdc_port = /dev/serial/by-id/usb-STMicroelectronics_BLACKPILL_F411CE_CDC_in_FS_Mode_338133833134-if00

[env:blackpill_f411ce_stlink]
upload_protocol = stlink
